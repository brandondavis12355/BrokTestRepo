<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe — Play vs AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      /* Deep gradient base */
      background: #0b0f1a;
      overflow: hidden;
      position: relative;
    }

    /* Deep gradient base layer */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 65%, rgba(168, 85, 247, 0.20) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 85%, rgba(236, 72, 153, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse at 90% 10%, rgba(59, 130, 246, 0.18) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Animated moving gradient orbs */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 20% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.12) 0%, transparent 35%);
      animation: orbMove 15s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes orbMove {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(3%, -4%) scale(1.05); }
      50%  { transform: translate(-2%, 3%) scale(0.97); }
      75%  { transform: translate(4%, 1%) scale(1.03); }
      100% { transform: translate(-3%, -2%) scale(1); }
    }

    /* Subtle dot grid for texture */
    .dot-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .status {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      min-height: 1.5rem;
      text-align: center;
      transition: color 0.2s;
    }
    .status.win  { color: #4ade80; }
    .status.lose { color: #f87171; }
    .status.draw { color: #fbbf24; }
    .status.turn { color: #93c5fd; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 300px;
      height: 300px;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
    }
    .cell {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .cell:hover:not(.taken):not(.game-over) {
      background: #273549;
      border-color: #475569;
      transform: scale(1.03);
    }
    .cell.taken { cursor: default; }
    .cell.x { color: #60a5fa; }
    .cell.o { color: #f472b6; }
    .cell.win-cell {
      background: #166534;
      border-color: #22c55e;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    button {
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.55rem 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .btn-new {
      background: #3b82f6;
      color: #fff;
    }
    .btn-new:hover { background: #2563eb; }
    .btn-new:disabled { background: #334155; color: #64748b; cursor: default; }
    .difficulty-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .difficulty-group label {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    select {
      font-size: 0.9rem;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
    }
    .legend {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .legend span.x { color: #60a5fa; font-weight: 700; }
    .legend span.o { color: #f472b6; font-weight: 700; }

    /* Turn-order selection overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 1rem;
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .overlay p {
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    .turn-buttons {
      display: flex;
      gap: 1rem;
    }
    .btn-turn {
      background: #1e293b;
      border: 2px solid #334155;
      color: #e2e8f0;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .btn-turn:hover {
      background: #334155;
      border-color: #60a5fa;
      transform: scale(1.05);
    }
    .btn-turn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <!-- Turn-order selection overlay -->
  <div id="turn-overlay" class="overlay">
    <h2>Who goes first?</h2>
    <p>Choose your side and decide who starts the game.</p>
    <div class="turn-buttons">
      <button class="btn-turn" onclick="chooseTurn('player')">You go first (O)</button>
      <button class="btn-turn" onclick="chooseTurn('ai')">AI goes first (X)</button>
    </div>
  </div>

  <h1>Tic Tac Toe</h1>
  <p class="subtitle">You are <strong style="color:#f472b6">O</strong> &nbsp;·&nbsp; AI is <strong style="color:#60a5fa">X</strong></p>

  <div id="status" class="status turn">Your turn — pick a cell</div>

  <!-- Animated background layers -->
  <div class="dot-grid"></div>
  <div class="particles" id="particles"></div>

  <div class="board" id="board">
    <div class="cell" data-pos="0"></div>
    <div class="cell" data-pos="1"></div>
    <div class="cell" data-pos="2"></div>
    <div class="cell" data-pos="3"></div>
    <div class="cell" data-pos="4"></div>
    <div class="cell" data-pos="5"></div>
    <div class="cell" data-pos="6"></div>
    <div class="cell" data-pos="7"></div>
    <div class="cell" data-pos="8"></div>
  </div>

  <div class="controls">
    <button class="btn-new" id="btn-new" onclick="newGame()">New Game</button>
    <div class="difficulty-group">
      <label for="difficulty">AI Difficulty:</label>
      <select id="difficulty" onchange="setDifficulty(this.value)">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
  </div>

  <p class="legend">
    <span class="x">X</span> = AI &nbsp;·&nbsp; <span class="o">O</span> = You
  </p>

  <script>
    // ── Animated floating particles (capped at ~50 for performance) ───────────
    (function initParticles() {
      const container = document.getElementById('particles');
      const PARTICLE_COUNT = 50;
      const colors = [
        'rgba(139, 92, 246, 0.45)',   // violet
        'rgba(59, 130, 246, 0.40)',   // blue
        'rgba(236, 72, 153, 0.35)',   // pink
        'rgba(99, 102, 241, 0.40)',   // indigo
        'rgba(168, 85, 247, 0.35)',   // purple
        'rgba(34, 211, 238, 0.30)',   // cyan
      ];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const el = document.createElement('div');
        el.classList.add('particle');
        const size = 2 + Math.random() * 4; // 2–6px
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const duration = 12 + Math.random() * 18; // 12–30s
        const delay = -(Math.random() * duration); // stagger start
        const opacity = 0.3 + Math.random() * 0.5;

        el.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          left: ${left}%;
          background: ${color};
          box-shadow: 0 0 ${size * 2}px ${color};
          animation-duration: ${duration}s;
          animation-delay: ${delay}s;
          opacity: ${opacity};
        `;
        container.appendChild(el);
      }
    })();

    // ── State ────────────────────────────────────────────────────────────────
    let board = Array(9).fill(null);
    let currentPlayer = "O";   // player is always O
    let winner = null;
    let draw = false;
    let aiThinking = false;
    let gameStarted = false;

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const cells = document.querySelectorAll(".cell");
    const statusEl = document.getElementById("status");
    const btnNew = document.getElementById("btn-new");
    const turnOverlay = document.getElementById("turn-overlay");

    // ── Turn-order selection ─────────────────────────────────────────────────
    async function chooseTurn(choice) {
      // choice: "player" (player goes first as O) or "ai" (AI goes first as X)
      try {
        const res = await fetch('/api/turn-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ choice })
        });
        if (!res.ok) {
          console.error('Failed to set turn order:', res.status, res.statusText);
        } else {
          await res.json();
        }
      } catch (err) {
        console.error('Turn-order request failed:', err);
      }

      // After setting turn order, start the game — use post() helper with error handling
      let gameState;
      try {
        gameState = await post('/api/new-game', {});
      } catch (err) {
        // If the server is unavailable or returns an error, still close the overlay
        console.error('Failed to start game:', err);
        gameState = { board: Array(9).fill(null), current_player: 'X' };
      }

      board = gameState.board;
      currentPlayer = gameState.current_player;
      winner = null;
      draw = false;
      aiThinking = false;
      gameStarted = true;

      // Hide the overlay
      turnOverlay.classList.add('hidden');

      render();

      // If AI goes first, trigger AI move
      if (currentPlayer === 'X' && !winner && !draw) {
        aiThinking = true;
        statusEl.textContent = 'AI is thinking…';
        statusEl.className = 'status turn';
        setTimeout(() => aiMove(), 400);
      }
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render() {
      cells.forEach((el, i) => {
        const mark = board[i];
        el.textContent = mark || "";
        el.className = "cell" + (mark ? " taken " + mark.toLowerCase() : "");
      });
      updateStatus();
    }

    function updateStatus() {
      if (winner === "X") {
        statusEl.textContent = "AI (X) wins! 🤖";
        statusEl.className = "status lose";
        highlightWinningLine("X");
      } else if (winner === "O") {
        statusEl.textContent = "You win! 🎉";
        statusEl.className = "status win";
        highlightWinningLine("O");
      } else if (draw) {
        statusEl.textContent = "It's a draw! 🤝";
        statusEl.className = "status draw";
      } else if (currentPlayer === "O") {
        statusEl.textContent = "Your turn — pick a cell";
        statusEl.className = "status turn";
      } else {
        statusEl.textContent = "AI is thinking…";
        statusEl.className = "status turn";
      }
    }

    function highlightWinningLine(mark) {
      const WIN_LINES = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (const [a, b, c] of WIN_LINES) {
        if (board[a] === mark && board[b] === mark && board[c] === mark) {
          [a, b, c].forEach(i => cells[i].classList.add("win-cell"));
          break;
        }
      }
    }

    // ── Server communication ─────────────────────────────────────────────────
    async function post(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    function updateState(state) {
      board = state.board;
      currentPlayer = state.current_player;
      winner = state.winner;
      draw = state.draw;
      aiThinking = false;
      render();
      if (currentPlayer === 'X' && !winner && !draw) {
        aiThinking = true;
        statusEl.textContent = 'AI is thinking…';
        statusEl.className = 'status turn';
        setTimeout(() => aiMove(), 400);
      }
    }

    // ── Player move ──────────────────────────────────────────────────────────
    cells.forEach(el => {
      el.addEventListener("click", () => {
        const pos = parseInt(el.dataset.pos, 10);
        if (winner || draw || aiThinking || board[pos] !== null) return;
        if (currentPlayer !== 'O') return;

        post('/api/move', { cell: pos + 1 })
          .then(updateState);
      });
    });

    // ── AI move ──────────────────────────────────────────────────────────────
    async function aiMove() {
      const difficulty = document.getElementById("difficulty").value;
      const res = await fetch('/api/ai-move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ difficulty })
      });
      const state = await res.json();
      updateState(state);
    }

    // ── New game ─────────────────────────────────────────────────────────────
    function newGame() {
      post('/api/new-game', {})
        .then(updateState);
    }

    // ── Difficulty change ────────────────────────────────────────────────────
    function setDifficulty(val) {
      post('/api/difficulty', { difficulty: val })
        .then(() => {});
    }
  </script>
</body>
</html>
